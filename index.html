<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Poster Wall</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #e9edf5;
        --ink-dim: rgba(233, 237, 245, 0.55);
        --accent: #ff7a3d;
        --glass: rgba(20, 24, 32, 0.42);
      }
      html, body {
        margin: 0;
        height: 100%;
        background: #1a1d24;
        overflow: hidden;
        font-family: 'IBM Plex Mono', ui-monospace, monospace;
        -webkit-font-smoothing: antialiased;
      }
      #stage, canvas { display: block; position: fixed; inset: 0; }
      .chrome {
        position: fixed;
        left: 0;
        right: 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 18px 22px;
        color: var(--ink);
        font-size: 11px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        pointer-events: none;
        mix-blend-mode: difference;
      }
      .top { top: 0; }
      .brand { display: flex; gap: 14px; align-items: center; }
      .dot { width: 7px; height: 7px; background: var(--accent); display: inline-block; }
      .dim { opacity: 0.6; }
      #hint {
        position: fixed;
        left: 50%;
        bottom: 22px;
        transform: translate(-50%, 6px);
        padding: 9px 16px;
        border-radius: 999px;
        background: var(--glass);
        color: var(--ink);
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        white-space: nowrap;
        pointer-events: none;
        backdrop-filter: blur(12px) saturate(1.2);
        -webkit-backdrop-filter: blur(12px) saturate(1.2);
        border: 1px solid rgba(255, 255, 255, 0.08);
        opacity: 0;
        transition: opacity 0.35s ease, transform 0.35s ease;
      }
      #hint.show { opacity: 1; transform: translate(-50%, 0); }
      #loader {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #1a1d24;
        color: var(--ink-dim);
        font-size: 11px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        transition: opacity 0.9s ease;
        z-index: 10;
      }
      #loader.done { opacity: 0; pointer-events: none; }
      #loader .bar { width: 120px; height: 1px; background: rgba(255,255,255,0.12); margin-top: 14px; overflow: hidden; }
      #loader .bar::after {
        content: ''; display: block; width: 40%; height: 100%; background: var(--accent);
        animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
      @media (max-width: 600px) {
        .chrome { padding: 14px 16px; font-size: 10px; }
        #hint { font-size: 10px; white-space: normal; text-align: center; width: calc(100% - 64px); }
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div class="chrome top">
      <div class="brand"><span class="dot"></span><span>Core — Poster Wall</span></div>
      <div><span class="dim">On wall&nbsp;&nbsp;</span><span id="count">00 / 08</span></div>
    </div>
    <div id="hint"></div>
    <div id="loader"><div><span>Plastering walls…</span><div class="bar"></div></div></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
