<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Poster Wall</title>
    <style>
      :root { color-scheme: light dark; }
      html, body { margin: 0; height: 100%; background: #f3eee6; overflow: hidden; font-family: -apple-system, system-ui, sans-serif; }
      canvas { display: block; }
      .hint {
        position: fixed;
        left: 20px;
        bottom: 20px;
        padding: 10px 14px;
        background: rgba(255, 255, 255, 0.6);
        color: #2a241c;
        border-radius: 10px;
        font-size: 12px;
        line-height: 1.5;
        pointer-events: none;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        max-width: 320px;
        border: 1px solid rgba(0,0,0,0.05);
      }
      .title {
        position: fixed;
        left: 20px;
        top: 20px;
        color: #2a241c;
        font-size: 11px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        opacity: 0.6;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="title">Poster Wall</div>
    <div class="hint">
      Click a rolled poster to hang it on the wall.<br />
      Click the hanging poster to roll it back.
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
